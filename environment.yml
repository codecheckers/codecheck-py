name: codecheck-env
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.9
  - nbconvert>=6
  - notebook>=6
  - jupyterlab
  - matplotlib>=3.4
  - pandas>=1.3
  - openpyxl  # Excel files in the manifest
  - pillow  # image dimensions in the manifest summary
  - tabulate
  - pyyaml
  - ruamel.yaml  # writes codecheck.yml keeping comments (update_config_from_doi)
  - pytest>=7.0
  - pytest-cov
  - requests
  - session-info2
  - ipywidgets
  - typst  # CLI used by notebook_to_pdf.sh to build the PDF
 
